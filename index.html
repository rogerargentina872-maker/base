<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Organizador con Estilo Moderno</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 20px;
      background: #f4f6f9;
      color: #333;
    }

    h1 {
      text-align: center;
      color: #2c3e50;
    }

    textarea {
      width: 100%;
      height: 200px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 10px;
    }

    button {
      background: #3498db;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      margin-right: 10px;
      transition: background 0.3s;
    }

    button:hover {
      background: #2980b9;
    }

    input {
      padding: 8px;
      width: 50%;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-top: 10px;
      font-size: 14px;
    }

    table {
      margin-top: 20px;
      border-collapse: collapse;
      width: 100%;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    th, td {
      border: 1px solid #eee;
      padding: 10px;
      text-align: left;
    }

    th {
      background-color: #3498db;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    td.seleccionada {
      outline: 2px solid #e67e22;
    }

    #colorBox {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #ffffff;
      border: 1px solid #ccc;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    #colorSelect {
      padding: 6px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
      margin-top: 5px;
      width: 100%;
    }
  </style>
</head>
<body>
  <h1>📊 Organizador de Información</h1>
  <p>Pega tu información en el cuadro de texto y se organizará en una tabla.</p>
  
  <textarea id="entrada" placeholder="Pega aquí tus registros..."></textarea>
  <br>
  <button onclick="organizar()">Organizar</button>
  <button onclick="exportarCSV()">Guardar en CSV</button>
  
  <br>
  <input type="text" id="buscador" placeholder="🔍 Buscar en la tabla..." onkeyup="filtrarTabla()">
  
  <div id="resultado"></div>

  <!-- Selector de color fijo -->
  <div id="colorBox">
    <label for="colorSelect"><b>Color de fondo:</b></label><br>
    <select id="colorSelect" onchange="cambiarColor()">
      <option value="white">Blanco</option>
      <option value="lightgreen">Verde</option>
      <option value="lightcoral">Rojo</option>
      <option value="lightsalmon">Naranja</option>
    </select>
    <p style="font-size:12px;">👉 Selecciona una celda y luego elige el color.</p>
  </div>

  <script>
    function organizar() {
      const texto = document.getElementById("entrada").value.trim();
      const resultadoDiv = document.getElementById("resultado");
      resultadoDiv.innerHTML = "";

      if (!texto) {
        resultadoDiv.innerHTML = "⚠️ No se ingresó información.";
        return;
      }

      const lineas = texto.split("\n");

      let tabla = "<table id='tabla'><thead><tr>" +
        "<th>Número</th><th>Mes</th><th>Año</th><th>Código</th>" +
        "<th>Nombre</th><th>ID</th><th>Dirección</th><th>Teléfono</th>" +
        "<th>Marca</th><th>Tipo</th><th>Banco</th><th>Clase</th><th>País</th>" +
        "</tr></thead><tbody>";

      lineas.forEach(linea => {
        const campos = linea.split("|");
        tabla += "<tr>";
        campos.forEach(campo => {
          tabla += `<td>${campo.trim() || "-"}</td>`;
        });
        tabla += "</tr>";
      });

      tabla += "</tbody></table>";
      resultadoDiv.innerHTML = tabla;

      document.querySelectorAll("#tabla td").forEach(td => {
        td.addEventListener("click", function() {
          document.querySelectorAll("#tabla td").forEach(c => c.classList.remove("seleccionada"));
          this.classList.add("seleccionada");
          window.celdaSeleccionada = this;
        });
      });
    }

    function filtrarTabla() {
      const filtro = document.getElementById("buscador").value.toLowerCase();
      const filas = document.querySelectorAll("#tabla tbody tr");

      filas.forEach(fila => {
        const textoFila = fila.textContent.toLowerCase();
        fila.classList.toggle("hide", !textoFila.includes(filtro));
      });
    }

    function cambiarColor() {
      if (window.celdaSeleccionada) {
        const color = document.getElementById("colorSelect").value;
        window.celdaSeleccionada.style.backgroundColor = color;
      } else {
        alert("⚠️ Primero selecciona una celda de la tabla.");
      }
    }

    function exportarCSV() {
      const filas = document.querySelectorAll("#tabla tr");
      let csv = [];

      filas.forEach(fila => {
        let columnas = fila.querySelectorAll("td, th");
        let filaCSV = [];
        columnas.forEach(col => filaCSV.push(col.innerText));
        csv.push(filaCSV.join(","));
      });

      const blob = new Blob([csv.join("\n")], { type: "text/csv" });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.setAttribute("href", url);
      a.setAttribute("download", "datos_organizados.csv");
      a.click();
    }
  </script>
</body>
</html>
